# Perfil directo para ejecutar en el servidor que ofrece los servicios por loopback.
mail.inbound.protocol=pop3
mail.inbound.host=127.0.0.1
mail.inbound.port=110
mail.inbound.ssl=false
mail.smtp.host=127.0.0.1
mail.smtp.port=25
mail.smtp.ssl=false
# El servidor permite retransmision por red autorizada; no acepta la clave POP3 como AUTH SMTP.
mail.smtp.auth=false
# El acceso alternativo por Roundcube requiere HTTPS.
mail.outbound.mode=smtp
mail.roundcube.url=https://mail.tecnoweb.org.bo/roundcubemail/
mail.username=grupo09sa
mail.address=grupo09sa@tecnoweb.org.bo
mail.password=${MAIL_PASSWORD}
db.url=jdbc:postgresql://127.0.0.1:5432/db_grupo09sa
db.username=grupo09sa
db.password=${DB_PASSWORD}
# Solo este remitente puede crear el primer DECANO. Después se ignora.
security.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
poll.seconds=10
network.connect.seconds=10
network.read.seconds=30
mail.max.messages.per.cycle=25
retry.max.seconds=300
mail.folder=INBOX
