# roundcube usa HTTPS para lectura y evita enviar la clave por POP3 sin TLS.
mail.inbound.protocol=roundcube
mail.inbound.host=mail.tecnoweb.org.bo
mail.inbound.port=110
mail.inbound.ssl=false
mail.smtp.host=mail.tecnoweb.org.bo
mail.smtp.port=25
mail.smtp.ssl=false
# El servidor permite retransmision por red autorizada; no acepta la clave POP3 como AUTH SMTP.
mail.smtp.auth=false
# Roundcube realiza la entrega desde el propio servidor y evita el bloqueo de relay externo.
mail.outbound.mode=roundcube
mail.roundcube.url=https://mail.tecnoweb.org.bo/roundcubemail/
mail.username=grupo09sa
mail.address=grupo09sa@tecnoweb.org.bo
mail.password=${MAIL_PASSWORD}
db.url=jdbc:postgresql://db.tecnoweb.org.bo:5432/db_grupo09sa
db.username=grupo09sa
db.password=${DB_PASSWORD}
poll.seconds=10
network.connect.seconds=10
network.read.seconds=30
mail.max.messages.per.cycle=25
retry.max.seconds=300
mail.folder=INBOX
