name: Verificación del proyecto

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-java17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TEST_DB_USER: audit
      TEST_DB_PASSWORD: ci-local-only
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validar script Linux
        run: sh -n scripts/run-service.sh
      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Comprobar JAR ejecutable
        run: test -s target/inf513-proyecto1-1.0.0.jar
      - name: Comprobar que dist corresponde al código
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/inf513-proyecto1-1.0.0.jar
          mkdir -p target/comparacion/compilado target/comparacion/entregado
          unzip -q target/inf513-proyecto1-1.0.0.jar 'bo/edu/uagrm/*' -d target/comparacion/compilado
          unzip -q dist/inf513-proyecto1-1.0.0.jar 'bo/edu/uagrm/*' -d target/comparacion/entregado
          diff -qr target/comparacion/compilado target/comparacion/entregado
