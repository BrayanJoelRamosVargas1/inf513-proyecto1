<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#34465d"/></marker></defs><rect width="100%" height="100%" fill="white"/><line x1="375" y1="85" x2="420" y2="85" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="770" y1="85" x2="815" y2="85" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="990" y1="150" x2="990" y2="210" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="815" y1="275" x2="770" y2="275" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="420" y1="275" x2="375" y2="275" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="200" y1="340" x2="200" y2="400" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><line x1="375" y1="465" x2="420" y2="465" stroke="#34465d" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="20" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="200" y="70">1. POSTULANTE envía</tspan><tspan x="200" y="100">INSPOST y PDF</tspan></text><rect x="420" y="20" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="595" y="70">2. Adaptador extrae MIME</tspan><tspan x="595" y="100">limitado</tspan></text><rect x="815" y="20" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="990" y="70">3. Cola persiste orden y</tspan><tspan x="990" y="100">PDF</tspan></text><rect x="815" y="210" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="990" y="260">4. Servicio solicita</tspan><tspan x="990" y="290">confirmación</tspan></text><rect x="420" y="210" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="595" y="260">5. Postulante devuelve</tspan><tspan x="595" y="290">CONFIRMAR</tspan></text><rect x="25" y="210" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="200" y="260">6. Validar vigencia y</tspan><tspan x="200" y="290">unicidad</tspan></text><rect x="25" y="400" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="200" y="450">7. Guardar postulación,</tspan><tspan x="200" y="480">PDF y SHA256</tspan></text><rect x="420" y="400" width="350" height="130" fill="#f3f6fa" stroke="#34465d" stroke-width="1.5"/><text font-family="Arial" font-size="23" text-anchor="middle" fill="#172434"><tspan x="595" y="465">8. Enviar resultado</tspan></text></svg>